# Mirrors this repo to the Hugging Face Space on every push to main.
# Needs a repo secret HF_TOKEN: a Hugging Face token with write access to the Space.
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add a repo secret named HF_TOKEN (Hugging Face write token) to enable syncing."
            exit 1
          fi
          # --force: GitHub is the source of truth; the Space's own history is replaced
          git push --force https://prajyot2003:$HF_TOKEN@huggingface.co/spaces/prajyot2003/LinguaCast main
